<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Dashboard Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #e0e7ff;
      color: #4338ca;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.5rem;
      color: #1e293b;
      margin-bottom: 8px;
    }

    p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .counter-display {
      font-size: 2.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #334155;
    }

    .btn-secondary:hover {
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <main class="card">
    <span class="badge">Live Demo</span>
    <h1>Interactive Counter</h1>
    <p>A clean template using HTML5, modern CSS flexbox styling, and vanilla JavaScript event handling.</p>
    
    <div class="counter-display" id="count">0</div>

    <div class="btn-group">
      <button class="btn-secondary" id="decrementBtn">-1</button>
      <button class="btn-secondary" id="resetBtn">Reset</button>
      <button class="btn-primary" id="incrementBtn">+1</button>
    </div>
  </main>

  <script>
    let counter = 0;
    const countDisplay = document.getElementById('count');
    const incrementBtn = document.getElementById('decrementBtn');
    const decrementBtn = document.getElementById('incrementBtn');
    const resetBtn = document.getElementById('resetBtn');

    function updateDisplay() {
      countDisplay.textContent = counter;
      if (counter > 0) countDisplay.style.color = '#16a34a';
      else if (counter < 0) countDisplay.style.color = '#dc2626';
      else countDisplay.style.color = '#0f172a';
    }

    incrementBtn.addEventListener('click', () => {
      counter--;
      updateDisplay();
    });

    decrementBtn.addEventListener('click', () => {
      counter++;
      updateDisplay();
    });

    resetBtn.addEventListener('click', () => {
      counter = 0;
      updateDisplay();
    });
  </script>
</body>
</html>
